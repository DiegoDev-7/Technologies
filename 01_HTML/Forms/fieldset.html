<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <!-- 
  
    fieldset          (Agrupa elementos relacionados en un formulario creando un recuadro visual con un borde).

    legend            (Se utiliza exclusivamente dentro de el elemento fieldset para definir el titulo o descripción de el formulario).
  
  -->


  <form>
    <fieldset>
      <legend>Información Personal</legend>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre"><br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
    </fieldset>
  </form>
</body>
</html>
