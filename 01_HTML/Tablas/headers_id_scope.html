<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    table,th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }
    th, td {
        padding: 10px;
        text-align: center;
    }
    th {
        text-align: center;
    }
    </style>
</head>

    <!-- headers, id, scope
     
    headers     (Los atributos header sirven para dar una descripcion de lo que es un td y th).

    id      (se usa para asignar un identificador único a un elemento dentro de un documento. 
            Este identificador debe ser único en toda la página).

    scope   (Se utiliza principalmente en celdas de encabezado (<th>) para indicar si esa celda es el 
            encabezado de una columna o una fila. No se usa en celdas de datos (<td>), solo en celdas de 
            encabezado.
                col: Indica que el encabezado aplica a la columna.
                row: Indica que el encabezado aplica a la fila.
                colgroup: El encabezado aplica a un grupo de columnas.
                rowgroup: El encabezado aplica a un grupo de filas.).

    -->

<body>
    <table>
        <thead>
          <tr>
            <th id="name">Nombre</th>
            <th id="age">Edad</th>
            <th id="city">Ciudad</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td headers="name">Juan</td>
            <td headers="age">25</td>
            <td headers="city">Bogotá</td>
          </tr>
          <tr>
            <td headers="name">Ana</td>
            <td headers="age">30</td>
            <td headers="city">Medellín</td>
          </tr>
        </tbody>
    </table>

    <br>

    <table>
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Edad</th>
            <th scope="col">Ciudad</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Juan</th>
            <td>25</td>
            <td>Bogotá</td>
          </tr>
          <tr>
            <th scope="row">Ana</th>
            <td>30</td>
            <td>Medellín</td>
          </tr>
        </tbody>
    </table>
</body>
</html>
