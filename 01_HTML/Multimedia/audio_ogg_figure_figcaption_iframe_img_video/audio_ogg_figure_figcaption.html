<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <!-- Elemento ogg, Figure, Figcaption.

    Audio   (Se utiliza para incrustar contenido de audio como mp3, ogg. etc...).

        controls    (Muestra controles de reproducción).

        autoplay    (Inicia la reproducción automáticamente al cargar la página).

        loop        (Repite el audio cuando termina).

        muted       (Comienza el audio en silencio).

        preload     (Indica al navegador si debe cargar el audio al cargar la página.

                    none        Indica que el navegador no debe cargar el archivo de audio 
                                o video hasta que el usuario lo reproduzca.     

                    metadata    Solo se cargan los metadatos del archivo, como la duración 
                                y la información sobre el archivo, pero no se descarga el
                                contenido en sí.

                    auto        El navegador decide automáticamente si carga el archivo o no, 
                                basado en su propio algoritmo o en el comportamiento del usuario).


    ogg     (Es un formato de video que permite ofrecer buena calidad de sonido con una alta tasa de compresión
            (no es compatible con safari y versiones antiguas De Internet Explorer)).

    Figure  (Se utiliza para agrupar el contenido visual, imagenes, graficos, videos, gif, tablas, etc.).
    
    Figcaption  (Describe el contenido entre figure y el contenido que esta relacionado es un subtitulo 
                o pie de figura). 
    
    -->

<body>
    <figure>
        <audio 
        controls
        autoplay>
        <source src="/Multimedia/audio_ogg_figure_figcaption_iframe_img_video/Archivos1/MOONDEITY X INTERWORLD - ONE CHANCE SLOWED + REVERBED - LOST WIDOW (youtube).mp3" type="audio/mp3">
        <source src="/Multimedia/audio_ogg_figure_figcaption_iframe_img_video/Archivos1/MOONDEITY X INTERWORLD - ONE CHANCE SLOWED + REVERBED (1080p, h264, youtube).ogg" type="audio/ogg">
        </audio>
        <figcaption>
            Audio MOONDEITY X INTERWORLD
        </figcaption>
    </figure>
</body>
</html>
