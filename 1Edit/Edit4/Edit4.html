<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Edit4.css">
</head>
<body>
    <label for="Caja">Elije un dispositivo:</label>
    <select id="Caja">
        <option value="Nada">Seleccione un dispositivo</option>
        <option value="Movil">Movil</option>
        <option value="Tablet">Tablet</option>
        <option value="Portatil">Portatil</option>
    </select>
    <div class="containerMovil">
        <div class="carcasa">
            <img class="fondo" src="/1Edit/Edit2/Imagenes/Fondo de pantalla.jpg" alt="Fondo de pantalla del dispositivo">
            <div class="barraNotificaciones"></div>
            <div class="contenidoSuperior"><!-- Borde superior -->
                <div class="bloqueSuperiorLeft">
                    <div id="reloj" class="hora">00:00</div>
                </div>
                <div class="bloqueSuperiorCenter">
                    <div class="ojoCam"></div>
                </div>
                <div class="bloqueSuperiorRight">
                    <div class="bloqueSuperiorRightInside">
                        <div class="iconSeñal"></div>
                        <div class="iconWifi"></div>
                        <div class="iconBateria"></div>
                    </div>
                </div>
            </div>
            <div class="contenidoInferior"><!-- Borde inferior -->
                <div class="transicionBotones">
                    <div class="botonesDisplay">
                        <div class="sombraSquare">
                            <button class="botonSquare"></button>
                        </div>
                        <div class="sombraCircle">
                            <button class="botonCircle">
                                <div class="botonCircleDentro"></div>
                            </button>
                        </div>
                        <div class="sombraTriangle">
                            <button class="botonTriangle"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="botonesRight"><!-- Botones laterales -->
            <button class="botonOnOff"></button>
            <button class="botonSubirVolume"></button>
            <button class="botonBajarVolume"></button>
        </div>
    </div>
</body>
</html>
